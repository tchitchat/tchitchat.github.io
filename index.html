<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TchitChat</title>
    <link rel="icon" type="image/x-icon" href="tchitchat.ico">
    <style>
        :root { --bg: #f8fbff; --card-bg: white; --text: #1f1f1f; --border: #e1e4e8; }
        [data-theme="dark"] { --bg: #131314; --card-bg: #1e1e20; --text: #e3e3e3; --border: #444746; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); display: flex; height: 100dvh; overflow: hidden; width: 100vw; }

        /* Sidebar - Mode Push (Pousse le contenu) */
        .sidebar { flex: 0 0 280px; margin-left: -280px; height: 100%; background-color: var(--bg); z-index: 1000; transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1); padding: 20px; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar.active { margin-left: 0; }
        
        .sidebar-brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .brand-logo { width: 32px; height: 32px; border-radius: 6px; }
        .brand-text { background: linear-gradient(90deg, #4285f4, #9b72cb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .btn-new-chat { background-color: #4285f4; color: white !important; border: none; border-radius: 12px; padding: 12px; width: 100%; margin-bottom: 15px; cursor: pointer; font-weight: 600; text-align: center; text-decoration: none; display: block; }

        .history-label { font-size: 12px; font-weight: bold; color: #70757a; margin: 10px 0; text-transform: uppercase; }
        #chatList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .chat-item { padding: 10px; border-radius: 8px; font-size: 14px; cursor: pointer; color: var(--text); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        .chat-item:hover { background: var(--border); }

        /* Main Content */
        .main-content { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        header { padding: 10px 15px; }
        .menu-toggle { width: 40px; cursor: pointer; height: 40px; display: flex; align-items: center; border-radius: 50%; padding: 8px; transition: background 0.2s;}
        .menu-toggle:hover { background: var(--border); }
        .menu-toggle img { width: 24px; }

        .chat-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .gradient-text { background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: clamp(32px, 8vw, 48px); font-weight: bold; }
        .subtitle { color: #c4c7c5; margin-top: 10px; font-weight: 500; }

        /* Zone de saisie extensible */
        .bottom-container { width: 100%; max-width: 800px; margin: 0 auto; padding: 10px 15px 30px 15px; } 
        .input-box { background: var(--card-bg); border-radius: 28px; display: flex; align-items: flex-end; padding: 8px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid var(--border); transition: all 0.3s ease; }
        
        /* Animation d'agrandissement au clic */
        .input-box:focus-within { border-radius: 16px; padding-bottom: 12px; border-color: #4285f4; }
        
        .input-box textarea { flex: 1; border: none; outline: none; font-size: 16px; padding: 8px 0; background: transparent; color: var(--text); resize: none; height: 40px; min-height: 40px; transition: height 0.3s ease; font-family: inherit; line-height: 1.5; }
        .input-box:focus-within textarea { height: 120px; }
        
        .send-btn { cursor: pointer; padding: 5px; margin-left: 10px; margin-bottom: 2px; transition: transform 0.2s; }
        .send-btn:active { transform: scale(0.9); }
        .send-btn img { width: 28px; }

        /* Sidebar Footer (Paramètres) */
        .sidebar-footer { margin-top: auto; padding-top: 15px; border-top: 1px solid var(--border); }
        .btn-auth { display: block; text-align: center; padding: 10px; background: #4285f4; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; margin-bottom: 5px; }
        .btn-settings { width: 100%; padding: 10px 12px; background: transparent; border: none; color: var(--text); border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; font-weight: 500; display: flex; align-items: center; transition: background 0.2s; }
        .btn-settings:hover { background: var(--border); }
        .btn-settings img { width: 18px; margin-right: 10px; opacity: 0.7; }

        /* Modal de Recherche (Clic droit) */
        .search-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); backdrop-filter: blur(3px); z-index: 9999; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.2s; }
        .search-overlay.active { display: flex; opacity: 1; }
        .search-modal { background: var(--card-bg); width: 500px; max-width: 90%; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); padding: 20px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 15px; }
        .search-modal input { width: 100%; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 16px; outline: none; transition: border 0.2s; }
        .search-modal input:focus { border-color: #4285f4; }
        #searchResults { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img src="logo.png" class="brand-logo" alt="Logo">
            <span class="brand-text">TchitChat</span>
        </div>
        <a href="index.html" class="btn-new-chat">+ Nouveau Tchit</a>
        <div class="history-label">Vos Tchits</div>
        <div id="chatList"></div>
        <div class="sidebar-footer" id="sidebarFooter">
            <!-- Injecté par JS -->
        </div>
    </aside>

    <main class="main-content">
        <header><div class="menu-toggle" id="menuBtn"><img src="menu.png" alt="Menu"></div></header>
        <div class="chat-area">
            <h1 class="gradient-text">Bienvenue</h1>
            <h1 class="subtitle">Sur TchitChat</h1>
        </div>
        <div class="bottom-container">
            <div class="input-box">
                <textarea id="userInput" placeholder="Écrivez à TchitChat..."></textarea>
                <div class="send-btn" id="sendBtn"><img src="send.png" alt="Envoyer"></div>
            </div>
        </div>
    </main>

    <!-- Popup de recherche -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-modal" onclick="event.stopPropagation()">
            <input type="text" id="searchInput" placeholder="Rechercher un Tchit...">
            <div id="searchResults"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, collection, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDU4105kXewXvvBlxkfH8MJNe6x0FQSB4o", 
            authDomain: "tchitchat-ia.firebaseapp.com", 
            projectId: "tchitchat-ia", 
            storageBucket: "tchitchat-ia.firebasestorage.app", 
            messagingSenderId: "784697397736", 
            appId: "1:784697397736:web:55295804d84feafda7945d" 
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let tousLesTchits = []; // Stockage local pour la recherche

        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');

        // --- CHARGEMENT HISTORIQUE ---
        function loadHistory(user) {
            const q = query(collection(db, "chats"), where("uid", "==", user.uid), orderBy("lastUpdate", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('chatList');
                list.innerHTML = "";
                tousLesTchits = []; // On vide le tableau à chaque mise à jour

                snapshot.forEach(doc => {
                    const texte = doc.data().messages[0]?.text || "Tchit " + doc.id;
                    tousLesTchits.push({ id: doc.id, text: texte }); // Sauvegarde pour la recherche

                    const item = document.createElement('a');
                    item.className = 'chat-item';
                    item.href = `./chat/?id=${doc.id}`;
                    item.innerText = texte;
                    list.appendChild(item);
                });
            });
        }

        // --- ENVOI DE MESSAGE ---
        function handleSend() {
            const text = document.getElementById('userInput').value.trim();
            if (!text) return;
            if (!auth.currentUser) { alert("Connecte-toi d'abord !"); return; }

            const numericId = Math.floor(10000000 + Math.random() * 90000000);
            sessionStorage.setItem('pendingMsg', text);
            window.location.href = `./chat/?id=${numericId}`;
        }

        document.getElementById('sendBtn').onclick = handleSend;
        
        // Gestion de la touche "Entrée" dans le textarea (Maj+Entrée pour sauter une ligne)
        document.getElementById('userInput').addEventListener('keydown', (e) => { 
            if(e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend(); 
            }
        });

        // --- AUTH & FOOTER MENU ---
        onAuthStateChanged(auth, (user) => {
            const footer = document.getElementById('sidebarFooter');
            if (user) {
                // On remplace le texte "Connecté" par le bouton Paramètres
                footer.innerHTML = `
                    <button class="btn-settings" id="btnSettings">
                        <img src="settings.png" alt="⚙️"> Paramètres
                    </button>
                `;
                
                // Action temporaire pour le bouton paramètres
                document.getElementById('btnSettings').onclick = () => alert("Le menu paramètres arrivera bientôt !");
                
                loadHistory(user);
            } else {
                footer.innerHTML = `<a href="./login/" class="btn-auth">Connexion</a>`;
            }
        });

        // --- INTERFACE ---
        // Menu Push (sans overlay)
        document.getElementById('menuBtn').onclick = () => { 
            document.getElementById('sidebar').classList.toggle('active'); 
        };

        // --- RECHERCHE (CLIC DROIT) ---
        const searchOverlay = document.getElementById('searchOverlay');
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');

        // Afficher au clic droit
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault(); // Annule le menu Windows/Mac classique
            searchOverlay.classList.add('active');
            searchInput.focus();
            searchInput.value = '';
            searchResults.innerHTML = '';
        });

        // Fermer la recherche si on clique en dehors de la boite ou si on appuie sur Echap
        searchOverlay.onclick = () => searchOverlay.classList.remove('active');
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') searchOverlay.classList.remove('active');
        });

        // Filtrer les Tchits en direct
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            searchResults.innerHTML = '';
            
            if (query === '') return; // Ne rien afficher si vide

            const filtres = tousLesTchits.filter(t => t.text.toLowerCase().includes(query));
            
            if (filtres.length === 0) {
                searchResults.innerHTML = `<div style="padding: 10px; color: #70757a; font-size: 14px; text-align: center;">Aucun Tchit trouvé...</div>`;
                return;
            }

            filtres.forEach(t => {
                const item = document.createElement('a');
                item.className = 'chat-item';
                item.style.background = "var(--bg)"; // Pour le différencier de la modal
                item.href = `./chat/?id=${t.id}`;
                item.innerText = t.text;
                searchResults.appendChild(item);
            });
        });
    </script>
</body>
</html>
